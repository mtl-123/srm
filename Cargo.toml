[package]
authors = ["Meitao Lin <mtl>"]
description = "Safe rm alternative with audit trail and short IDs"
edition = "2021"
license = "MIT"
name = "srm"
version = "2.1.1"
rust-version = "1.85"

[dependencies]
bytesize = "1.3"
chrono = {version = "0.4.43", features = ["clock"]}
clap = {version = "4.5", features = ["derive"]}
ctrlc = "3.4"
fs2 = "0.4"
indicatif = "0.17"
libc = "0.2"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
